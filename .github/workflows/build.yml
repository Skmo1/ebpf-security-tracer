name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances (clang, llvm, libbpf)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-$(uname -r)

      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Générer le code eBPF (bpf2go)
        run: |
          cd cmd/detector
          go generate ./...

      - name: Build
        run: go build -o bin/detector ./cmd/detector

      - name: Vet
        run: go vet ./...
